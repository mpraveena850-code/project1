
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Fem Track</title>
    <link rel="icon" href="img.html/logo.jpg.png">
    <link rel="stylesheet" href="style.css"> 
    <style>
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }
        
        table {
            border-spacing: 10px;
        }

        td {
            font-size: 1.1rem;
            font-weight: bold;
        }

        input {
            padding: 5px 10px;
            font-size: 1rem;
            border: 1px solid #000;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            font-size: 1rem;
            font-weight: bold;
            margin: 5px;
            cursor: pointer;
            border: 1px solid #000;
            border-radius: 4px;
            background-color: #ffffff;
        }

        button[type="submit"] {
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="brand-container">
            <img src="img.html/logo.jpg.png" alt="Fem Track Logo" class="logo-img">
            <h1 class="one">Fem Track</h1>
        </div>

        <nav class="nav-links">
            <a href="index..html">Home</a>
            <a href="#">About Us</a>
            <a href="log.html">Login</a>
        </nav>
    </header>
    <hr class="line-break">

    <main class="content-area form-container">
        <form>
            <table>
                <tr>
                    <td>Name:</td> 
                    <td><input type="text" placeholder="Enter your Name" required></td>
                </tr>
                <tr>
                    <td>Age:</td> 
                    <td><input type="number" placeholder="Enter your Age" required></td>
                </tr>
                <tr>
                    <td>DOB:</td> 
                    <td><input type="date" required></td>
                </tr>
                <tr>
                    <td>Weight:</td> 
                    <td><input type="number" placeholder="Enter your Weight" required></td>
                </tr>
                <tr>
                    <td>Height:</td> 
                    <td><input type="number" placeholder="Enter your Height" required></td>
                </tr>
            </table>
            <br>
            <button type="submit">Next</button> 
            <button type="button" onclick="window.location.href='index.html'">Back</button> 
            <button type="reset">Reset</button>
        </form>
    </main>

    <hr class="line-break">
    <footer class="site-footer">
        <p>&copy; 2026 Fem Track. All Rights Reserved.</p>
    </footer>

</body>
</html>
