<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Theme Login Form</title>
    <style>
        /* Muriya Background matrum Core Styles */
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background:rgb(243, 169, 180);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Login Card Box Design */
        .login-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid rgba(255, 182, 193, 0.5);
        }

        /* Title Design */
        .login-card h2 {
            color: #ff69b4; /* Hot Pink */
            margin-bottom: 5px;
            font-size: 28px;
        }

        .login-card p {
            color: #8b7b8b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Input Group Grid */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ff69b4;
            font-weight: 600;
        }

        /* Username & Password Inputs */
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffe4e1;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #fffafb;
        }

        /* Input click aagum pothu pink glow vara */
        .input-group input:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.25);
            background-color: #ffffff;
        }

        /* Pink Login Button */
        .btn-login {
            background: linear-gradient(90deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        /* Button Hover Effect */
        .btn-login:hover {
            background: linear-gradient(90deg, #ff1493, #c71585);
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 20, 147, 0.4);
        }

        /* Extra link (Forgot password / Sign up placeholders) */
        .extra-links {
            margin-top: 20px;
            font-size: 13px;
        }

        .extra-links a {
            color: #ff69b4;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Please enter your details to sign in</p>
        
        <form action="#" method="POST">
            <!-- Username Input -->
            <div class="input-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            
            <!-- Password Input -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="extra-links">
            <a href="#">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
